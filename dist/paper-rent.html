s more than straight-line rent.`,"MPW|Total debt (sum of all borrowings)":`Balance sheet 'Debt, net' (carrying value).`,"MPW|Straight-line rent receivable (balance)":`Face of balance sheet, 'Straight-line rent receivables' (FY2024 10-K p.70: 700,783 / 635,987 $ thousands).`,"MPW|Loans to tenants (mortgage and other loans receivable)":`Mortgage loans + Other loans (BS) + loan-type investments in unconsolidated operating entities (Steward loan, Springstone/Lifepoint loan, Priory term loan, international JV loan) per Note 3 tables. Excludes $1.06-2.05B of financing-lease receivables that share the same CECL allowance.`,"MPW|Allowance for credit losses on loans":`Note 2 'Credit Losses' rollforward (FY2024 10-K p.85; FY2023 10-K p.83). One combined reserve for loans AND financing leases; MPW does not split it. Unfunded commitments are not mentioned. Provision 41.7 / 99.0 / 10.2 / 1,241.0; 'written off or related to instruments sold, repaid, or satisfied' (26.4) / (35.3) / (825.5).`,"MPW|Straight-line rent / receivable write-offs during the year":`CFS 'Straight-line rent and other write-off'. FY2022 excludes ~$125M SL write-off netted inside the Macquarie sale gain. FY2023 = ~$95M Utah SL write-off + Q4 Steward reserves ($154M billed rent, $224M SL rent, $35M interest) + other tenants (~$95M).`,"MPW|Revenue from largest single tenant":`Steward. The FY2021-FY2023 10-Ks give no dollar or percentage figure: only that Steward, Circle and Prospect 'individually represented more than 10% of our total revenues' (FY2022 10-K p.85; the FY2023 10-K p.96 adds 'excluding reserves recorded during the year'). FY2022 Steward revenue ($427.9M, 27.7%) first appears in the FY2024 10-K concentration table (p.100), after the bankruptcy. FY2024 largest = Circle ($205.6M, 20.7%).`,"MPW|Impairment charges (real estate and other)":`IS 'Real estate and other impairment charges, net'. FY2024 excludes a further $410.8M equity-interest real estate impairment in the equity-interest line.`,"MPW|Income (loss) from unconsolidated joint ventures":`IS 'Earnings (loss) from equity interests'.`,"OHI|Total equity":`Total incl. noncontrolling interest (~5% of total). Parent-only: 3,906.8 / 3,609.4 / 3,574.6 / 4,536.7.`,"OHI|Straight-line rent adjustment (non-cash)":`CFS reconciliation line 'Straight-line rent and effective interest receivables' (FY2023/FY2024 10-K presentation): non-cash revenue deducted from net income to reach CFO.`,"OHI|Total debt (sum of all borrowings)":`Revolver + secured borrowings + senior notes & other unsecured (net).`,"OHI|Loans to tenants (mortgage and other loans receivable)":`Net: mortgage notes + other real estate loans + non-real-estate loans (Note 13). FY2021 = mortgage 835.1 + other investments 469.9.`,"OHI|Allowance for credit losses on loans":`Loans only: real estate loans + non-real estate loans, from Note 9 'Allowance for Credit Losses' rollforward (FY2024 10-K p.F-46). Excludes direct financing leases (0.5 / 2.8 / 2.5 / 1.6) and unfunded loan commitments (0.9 / 0.3 / 7.1 / 3.0), which OHI reports in the same table; all-instrument total 144.5 / 188.4 / 222.2 / 198.6.`,"OHI|Straight-line rent / receivable write-offs during the year":`Note 5: SL + lease-inducement write-offs on cash-basis moves (36.0 / 119.8) + operator transitions (1.3 / 3.2); FY2023-24 incl. effective-yield interest write-offs.`,"OHI|Revenue from largest single tenant":`Not disclosed in dollars. OHI discloses only the largest operators' share of total revenue: Consulate 9.5% (FY2021, FY2021 10-K p.F-43), LaVie (formerly Consulate) 11.1% (FY2022, FY2022 10-K p.F-51), CommuniCare 11.5% (FY2023, FY2023 10-K p.F-52) - all 'excluding the impact of write-offs' - and CommuniCare 11.8% (FY2024, FY2024 10-K p.F-52) including write-offs. The ratio row shows these disclosed percentages; no dollar amount is implied.`,"SBRA|Total revenue":`Includes resident fees & services (managed senior housing): 155.5 / 186.7 / 236.2 / 284.6. Comparable (rental + interest) revenue: 414.0 / 438.2 / 411.4 / 418.7.`,"SBRA|Straight-line rent adjustment (non-cash)":`CFS 'Non-cash rental and related revenues' (SL rent + intangible amortization + write-offs; positive = write-offs exceeded accrual).`,"SBRA|Straight-line rent receivable (balance)":`Not disclosed as a standalone balance (inside 'accounts receivable, prepaid expenses and other assets').`,"SBRA|Straight-line rent / receivable write-offs during the year":`FY2021 Avamere $25.2M ($44.0M incl. above-market intangible); FY2022 North American $15.6M ($17.1M total). None disclosed FY2023-24.`,"SBRA|Revenue from largest single tenant":`Not disclosed: 'no tenant relationship represented 10% or more of total revenues' in every year.`,"SBRA|Income (loss) from unconsolidated joint ventures":`IS line incl. Enlivant JV other-than-temporary impairments of $164.1M (FY21) and $57.8M (FY22).`,"OHI|Real estate loans interest income":`FY2024 10-K consolidated statements of operations (FY2022-FY2024). FY2021 not collected: it falls outside the three years presented in that filing.`,"OHI|Non-real estate loans interest income":`FY2024 10-K consolidated statements of operations (FY2022-FY2024). FY2021 not collected: it falls outside the three years presented in that filing.`,"OHI|Miscellaneous income":`FY2024 10-K consolidated statements of operations (FY2022-FY2024). FY2021 not collected: it falls outside the three years presented in that filing.`,"MPW|Largest tenant share of total assets (Steward)":`Share of total assets per the 10-K concentration disclosures (FY2021-FY2023). No FY2024 figure in the data set.`,"MPW|Investment in loans receivable (CFS)":`Consolidated statements of cash flows, investing activities, 'Investment in loans receivable': FY2021 from the FY2022 10-K (58,932), FY2022-FY2024 from the FY2024 10-K (207,542 / 250,223 / 420,324), $ thousands. Cash advanced on loans to all borrowers, not only rent-paying tenants.`,"MPW|Principal received on loans receivable (CFS)":`Consolidated statements of cash flows, investing activities, 'Principal received on loans receivable' (FY2024 10-K label: 'Principal received from sale and repayment of loans receivable'): FY2021 from the FY2022 10-K (1,595,708), FY2022-FY2024 from the FY2024 10-K (53,322 / 501,630 / 214,416), $ thousands.`,"MPW|Net income (loss), consolidated":`Consolidated statements of cash flows, first line 'Net income (loss)' (includes noncontrolling interests; MPW's are small). FY2021 from the FY2023 10-K; FY2022-FY2024 from the FY2024 10-K p.74. Attributable to common: 656.0 / 902.6 / -556.5 / -2,410.3.`,"OHI|Net income (loss), consolidated":`Consolidated statements of cash flows, first line 'Net income' (includes noncontrolling interests in Omega OP units). FY2024 10-K p.F-8. Attributable to common: 416.7 / 426.9 / 242.2 / 406.3.`,"SBRA|Net income (loss), consolidated":`Consolidated statements of cash flows, first line 'Net income (loss)'. Noncontrolling interests are immaterial, so consolidated and attributable-to-common net income are the same to $0.1M.`,"SBRA|Allowance for credit losses on loans":`'Allowance for loan losses' on loans receivable (FY2024 10-K loans receivable note). Covers loans only; preferred equity investments are separate.`},story_facts:{MPW_steward_share_of_assets:{2021:.251,2022:.242,2023:.192},MPW_steward_revenue_2022:427.9,MPW_steward_revenue_share_2022:.277,MPW_steward_share_first_disclosed_in:`FY2024 10-K`,MPW_new_steward_loan_2022Q2:150,MPW_steward_q4_2023_paid:16,MPW_steward_q4_2023_due:70,MPW_steward_charges_2023:{"Reserve of unpaid rent and lease incentives":154,"Reserve of straight-line rent receivables":224,"Reserve of unpaid interest":35,"Impairment: equity investment and other":171,"Impairment: real estate":100,"Reserve in MAM partnership":30,total:714},MPW_steward_charges_2024:{"Working capital and other loans":787,"Investment in Massachusetts partnership":445,"Real estate":277,"Equity investment and other":54,total:1563},MPW_utah_sl_writeoff_2023:95,MPW_2023_revenue_reserv
